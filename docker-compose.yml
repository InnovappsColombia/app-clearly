version: '3.8'

# ==============================================================================
# CLEARLY — Local-First Sovereign Infrastructure Stack
# Services: PostgreSQL 16 (pgvector), Redis 7, MinIO S3, FastAPI Backend, Next.js 14
# ==============================================================================

networks:
  clearly-network:
    name: clearly-network
    driver: bridge

volumes:
  pgdata:
    name: clearly_pgdata
  miniodata:
    name: clearly_miniodata
  redisdata:
    name: clearly_redisdata

services:
  # ----------------------------------------------------------------------------
  # 1. BASE DE DATOS SOBERANA: PostgreSQL 16 con extensión pgvector
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: clearly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clearly_db}
      POSTGRES_USER: ${POSTGRES_USER:-clearly_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clearly_secure_pass_2026!}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./Database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - clearly-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clearly_admin} -d ${POSTGRES_DB:-clearly_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. BROKER DE MENSAJES Y CACHÉ: Redis 7
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: clearly-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    networks:
      - clearly-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. ALMACENAMIENTO DE OBJETOS S3 AUTOHOSPEDADO: MinIO
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: clearly-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clearly_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-clearly_minio_secret_key_2026!}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Web Console UI
    networks:
      - clearly-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 4. MINIO BUCKET INITIALIZER (Creación automática de buckets privados)
  # ----------------------------------------------------------------------------
  create-buckets:
    image: minio/mc:latest
    container_name: clearly-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - clearly-network
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set clearly http://minio:9000 ${MINIO_ROOT_USER:-clearly_minio_admin} ${MINIO_ROOT_PASSWORD:-clearly_minio_secret_key_2026!};
      /usr/bin/mc mb clearly/${MINIO_DOCUMENTS_BUCKET:-clearly-documents} --ignore-existing;
      /usr/bin/mc mb clearly/${MINIO_AUDIO_BUCKET:-clearly-audio} --ignore-existing;
      echo 'MinIO buckets successfully initialized!';
      exit 0;
      "

  # ----------------------------------------------------------------------------
  # 5. BACKEND CORE API (FastAPI) — [Sprint 1 Implemented]
  # ----------------------------------------------------------------------------
  backend-api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: clearly-backend-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-clearly_admin}:${POSTGRES_PASSWORD:-clearly_secure_pass_2026!}@postgres:5432/${POSTGRES_DB:-clearly_db}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clearly_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-clearly_minio_secret_key_2026!}
      MINIO_DOCUMENTS_BUCKET: ${MINIO_DOCUMENTS_BUCKET:-clearly-documents}
      MINIO_AUDIO_BUCKET: ${MINIO_AUDIO_BUCKET:-clearly-audio}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - clearly-network

  # ----------------------------------------------------------------------------
  # 6. FRONTEND WEB ACCESIBLE (Next.js 14) — [Sprint 2 Implemented]
  # ----------------------------------------------------------------------------
  frontend-web:
    build:
      context: ./Frontend/web-app
      dockerfile: Dockerfile
    container_name: clearly-frontend-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend-api
    networks:
      - clearly-network

  # ----------------------------------------------------------------------------
  # 7. GATEWAY DE WHATSAPP AUTOHOSPEDADO (Evolution API v2) — [Sprint 3]
  # ----------------------------------------------------------------------------
  evolution-api:
    image: atendai/evolution-api:v2.0.0
    container_name: clearly-evolution-api
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-clearly_evolution_api_key_2026}
      DATABASE_ENABLED: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://backend-api:8000/api/v1/webhooks/whatsapp
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - backend-api
    networks:
      - clearly-network

  # ----------------------------------------------------------------------------
  # 8. SERVIDOR DE VIDEOCONSULTA ACCESIBLE (LiveKit WebRTC) — [Sprint 4]
  # ----------------------------------------------------------------------------
  livekit:
    image: livekit/livekit-server:v1.7
    container_name: clearly-livekit
    restart: unless-stopped
    command: --dev --bind 0.0.0.0
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-clearly_livekit_key_2026}: ${LIVEKIT_API_SECRET:-clearly_livekit_secret_pass_2026!}"
    ports:
      - "7880:7880"     # HTTP signaling / WebSockets
      - "7881:7881"     # TCP fallback
      - "7882:7882/udp" # UDP WebRTC media
    networks:
      - clearly-network
